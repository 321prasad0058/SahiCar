# Every Monday morning: research the week's launches, new announcements and price changes with Gemini, rebuild and
# check the data, and open a pull request for a person to read. Nothing goes live until that pull request is merged
# (merging runs deploy.yml). GitHub emails the assignee when the pull request opens; if the MAIL_* secrets are set,
# the designed report email is sent as well, and in a week with no changes a short "no changes" email, so a quiet
# week never looks like a missed run.
name: Weekly inventory update

on:
  schedule:
    # Mondays 03:13 UTC = 08:43 IST: odd minutes, since GitHub delays scheduled jobs most at round times (:00, :30).
    # GitHub may also drop a scheduled run when it is busy (16 Nov 2026 never started), so there are backups later
    # on Monday and on Tuesday morning. Each one first checks whether this week's update already ran (the "guard"
    # job below) and stops if it did, so a week never gets two pull requests.
    - cron: '13 3 * * 1' # Monday 08:43 IST
    - cron: '47 5 * * 1' # Monday 11:17 IST, backup
    - cron: '23 9 * * 1' # Monday 14:53 IST, backup
    - cron: '13 3 * * 2' # Tuesday 08:43 IST, last backup
  workflow_dispatch: # "Run workflow" button, for an update on demand (always runs)

permissions:
  actions: read # the guard reads this workflow's past runs
  contents: write
  pull-requests: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  # Has this week's update already run? This week starts Monday 00:00 IST. A run by hand always goes ahead.
  guard:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "Started by hand: running."; exit 0; fi
          # this Monday 00:00 IST, in UTC (Python is on every GitHub runner)
          since=$(python3 -c "import datetime as d; ist=d.timezone(d.timedelta(hours=5,minutes=30)); n=d.datetime.now(ist); m=(n-d.timedelta(days=n.weekday())).replace(hour=0,minute=0,second=0,microsecond=0); print(m.astimezone(d.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))")
          done=$(gh run list -R "$GITHUB_REPOSITORY" --workflow weekly-update.yml --limit 30 \
            --json databaseId,status,conclusion,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt >= \"$since\" and (.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\"))] | length")
          if [ "$done" -gt 0 ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "This week's update already ran (since $since): skipping."
          else echo "go=true" >> "$GITHUB_OUTPUT"; echo "No update yet this week (since $since): running."; fi

  update:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same as local: its npm reads package-lock.json the same way
          cache: npm

      - run: npm ci

      - name: Research this week's changes (Gemini + Google Search)
        id: research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          node scripts/weekly-update.mjs | tee research.log
          echo "changes=$(grep -o 'weekly-update: [0-9]*' research.log | grep -o '[0-9]*$')" >> "$GITHUB_OUTPUT"

      # the same checks run before every deploy: bad data stops here, before anyone is asked to merge it
      - name: Rebuild the site data and check it
        run: |
          npm run data
          npm run test:engine
          npx tsc -b
          node scripts/build-sitemap.mjs

      - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/weekly-inventory # not under weekly-update/: a branch already has that name
          delete-branch: true
          title: 'Weekly inventory update'
          body-path: weekly-summary.md
          commit-message: 'weekly: inventory update'
          author: Prasad Alai <110602321+321prasad0058@users.noreply.github.com>
          committer: Prasad Alai <110602321+321prasad0058@users.noreply.github.com>
          add-paths: |
            research/*.json
            src/data/*.json
            public/sitemap.xml
          assignees: 321prasad0058
          labels: weekly-update

      # optional: the designed HTML email (same report as the pull request), on top of GitHub's own notification
      - name: Put the pull request link into the email
        if: steps.pr.outputs.pull-request-url != '' && env.HAS_MAIL == 'true'
        run: sed -i "s#{{PR_URL}}#${{ steps.pr.outputs.pull-request-url }}#g" weekly-email.html

      # pasted secrets often carry spaces or a line break, which Gmail rejects: strip them, and print a safe check
      # (lengths only, never the values)
      - name: Check the mail login
        if: env.HAS_MAIL == 'true'
        env:
          RAW_USER: ${{ secrets.MAIL_USERNAME }}
          RAW_PASS: ${{ secrets.MAIL_PASSWORD }}
          RAW_TO: ${{ secrets.MAIL_TO }}
        run: |
          u="$(printf '%s' "$RAW_USER" | tr -d '[:space:]')"
          # a Gmail App Password is 16 letters; copying it can bring invisible separators (non-breaking spaces)
          p="$(printf '%s' "$RAW_PASS" | LC_ALL=C tr -cd 'A-Za-z')"
          t="$(printf '%s' "$RAW_TO" | tr -d '[:space:]')"
          echo "::add-mask::$p"
          { echo "MAIL_USER=$u"; echo "MAIL_PASS=$p"; echo "MAIL_DEST=$t"; } >> "$GITHUB_ENV"
          case "$u" in *@*) at=yes;; *) at=NO;; esac
          same=no; [ "$(printf '%s' "$u" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$t" | tr 'A-Z' 'a-z')" ] && same=YES
          echo "Sender has @: $at · sender domain: ${u#*@} · password length: ${#p} (a Gmail App Password is 16)"
          echo "Recipient domain: ${t#*@} · recipient is the same address as the sender: $same"

      - name: Email the report
        if: steps.pr.outputs.pull-request-url != '' && env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USER }}
          password: ${{ env.MAIL_PASS }}
          to: ${{ env.MAIL_DEST }}
          from: SahiCar weekly update <${{ env.MAIL_USER }}>
          subject: 'SahiCar weekly update: ready for your approval'
          html_body: file://weekly-email.html
          body: |
            This week's SahiCar update is ready for you to check and approve:
            ${{ steps.pr.outputs.pull-request-url }}

      # a quiet week: no pull request, so say so, rather than leave silence that looks like a missed run
      - name: Email that there were no changes
        if: steps.research.outputs.changes == '0' && env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USER }}
          password: ${{ env.MAIL_PASS }}
          to: ${{ env.MAIL_DEST }}
          from: SahiCar weekly update <${{ env.MAIL_USER }}>
          subject: 'SahiCar weekly update: no changes this week'
          html_body: file://weekly-email.html
          body: |
            This week's SahiCar check found no launches, announcements or price changes. Nothing needs your approval.
