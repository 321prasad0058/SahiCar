# Every Monday morning: research the week's launches, new announcements and price changes with Gemini, rebuild and
# check the data, and open a pull request for a person to read. Nothing goes live until that pull request is merged
# (merging runs deploy.yml). GitHub emails the assignee when the pull request opens; if the MAIL_* secrets are set,
# a second email with the full summary is sent as well.
name: Weekly inventory update

on:
  schedule:
    - cron: '30 3 * * 1' # Mondays 03:30 UTC = 09:00 IST
  workflow_dispatch: # "Run workflow" button, for an update on demand

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same as local: its npm reads package-lock.json the same way
          cache: npm

      - run: npm ci

      - name: Research this week's changes (Gemini + Google Search)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/weekly-update.mjs

      # the same checks run before every deploy: bad data stops here, before anyone is asked to merge it
      - name: Rebuild the site data and check it
        run: |
          npm run data
          npm run test:engine
          npx tsc -b
          node scripts/build-sitemap.mjs

      - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/weekly-inventory # not under weekly-update/: a branch already has that name
          delete-branch: true
          title: 'Weekly inventory update'
          body-path: weekly-summary.md
          commit-message: 'weekly: inventory update'
          author: Prasad Alai <110602321+321prasad0058@users.noreply.github.com>
          committer: Prasad Alai <110602321+321prasad0058@users.noreply.github.com>
          add-paths: |
            research/*.json
            src/data/*.json
            public/sitemap.xml
          assignees: 321prasad0058
          labels: weekly-update

      # optional: the designed HTML email (same report as the pull request), on top of GitHub's own notification
      - name: Put the pull request link into the email
        if: steps.pr.outputs.pull-request-url != '' && env.HAS_MAIL == 'true'
        run: sed -i "s#{{PR_URL}}#${{ steps.pr.outputs.pull-request-url }}#g" weekly-email.html

      # pasted secrets often carry spaces or a line break, which Gmail rejects: strip them, and print a safe check
      # (lengths only, never the values)
      - name: Check the mail login
        if: env.HAS_MAIL == 'true'
        env:
          RAW_USER: ${{ secrets.MAIL_USERNAME }}
          RAW_PASS: ${{ secrets.MAIL_PASSWORD }}
          RAW_TO: ${{ secrets.MAIL_TO }}
        run: |
          u="$(printf '%s' "$RAW_USER" | tr -d '[:space:]')"
          p="$(printf '%s' "$RAW_PASS" | tr -d '[:space:]')"
          t="$(printf '%s' "$RAW_TO" | tr -d '[:space:]')"
          echo "::add-mask::$p"
          { echo "MAIL_USER=$u"; echo "MAIL_PASS=$p"; echo "MAIL_DEST=$t"; } >> "$GITHUB_ENV"
          case "$u" in *@*) at=yes;; *) at=NO;; esac
          echo "Sender has @: $at · sender domain: ${u#*@} · password length: ${#p} (a Gmail App Password is 16) · recipient has @: $(case "$t" in *@*) echo yes;; *) echo NO;; esac)"

      - name: Email the report
        if: steps.pr.outputs.pull-request-url != '' && env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USER }}
          password: ${{ env.MAIL_PASS }}
          to: ${{ env.MAIL_DEST }}
          from: SahiCar weekly update <${{ env.MAIL_USER }}>
          subject: 'SahiCar weekly update: ready for your approval'
          html_body: file://weekly-email.html
          body: |
            This week's SahiCar update is ready for you to check and approve:
            ${{ steps.pr.outputs.pull-request-url }}
