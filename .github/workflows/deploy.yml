# Builds and deploys the site to Firebase Hosting whenever main changes, which is when a weekly update (or any other
# pull request) is merged. Also runnable by hand from the Actions tab.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAHICAR_IN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the alerts step compares the car data with the previous deploy

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same as local: its npm reads package-lock.json the same way
          cache: npm

      - run: npm ci

      # data build, sitemap, type check and Vite build: a broken build never reaches the live site
      - run: npm run build

      - name: Deploy to sahicar-in.web.app
        if: env.HAS_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAHICAR_IN }}
          channelId: live
          projectId: sahicar-in

      # alerts: once the new data is live, tell subscribers about price changes on their saved cars and new launches
      # (skips itself when the car data didn't change, or when the push secrets aren't set)
      - name: Send alerts about what changed
        if: env.HAS_SA == 'true' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_ADMIN_SA: ${{ secrets.FIREBASE_ADMIN_SA }}
        run: |
          if git diff --quiet ${{ github.event.before }} HEAD -- src/data/cars.json; then
            echo "car data unchanged: no alerts"
          else
            node scripts/push-send.mjs --changes ${{ github.event.before }}
          fi

      - name: Explain a skipped deploy
        if: env.HAS_SA != 'true'
        run: |
          echo "::warning::Deploy skipped - add the FIREBASE_SERVICE_ACCOUNT_SAHICAR_IN secret (see docs/weekly-update.md)."
