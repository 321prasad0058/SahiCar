# Sends a test of the weekly email: the report built from sample updates (no research, no data changes), opened
# as an issue assigned to you so GitHub emails it, plus the designed HTML email if the Gmail secrets are set.
# Run it from Actions → "Send a test weekly email" → Run workflow.
name: Send a test weekly email

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the report from sample updates
        run: node scripts/weekly-update.mjs --sample

      # opened by GitHub Actions and assigned to you, so GitHub sends you its email (it never emails you about
      # things you did yourself)
      - name: Open it as an issue assigned to you
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh issue create --repo "${{ github.repository }}" \
            --title "Test: SahiCar weekly update email" \
            --body-file weekly-summary.md \
            --assignee 321prasad0058)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: Put the link into the designed email
        if: env.HAS_MAIL == 'true'
        run: sed -i "s#{{PR_URL}}#${{ steps.issue.outputs.url }}#g" weekly-email.html

      # pasted secrets often carry spaces or a line break, which Gmail rejects: strip them, and print a safe check
      # (lengths only, never the values)
      - name: Check the mail login
        if: env.HAS_MAIL == 'true'
        env:
          RAW_USER: ${{ secrets.MAIL_USERNAME }}
          RAW_PASS: ${{ secrets.MAIL_PASSWORD }}
          RAW_TO: ${{ secrets.MAIL_TO }}
        run: |
          u="$(printf '%s' "$RAW_USER" | tr -d '[:space:]')"
          # a Gmail App Password is 16 letters; copying it can bring invisible separators (non-breaking spaces)
          p="$(printf '%s' "$RAW_PASS" | LC_ALL=C tr -cd 'A-Za-z')"
          t="$(printf '%s' "$RAW_TO" | tr -d '[:space:]')"
          echo "::add-mask::$p"
          { echo "MAIL_USER=$u"; echo "MAIL_PASS=$p"; echo "MAIL_DEST=$t"; } >> "$GITHUB_ENV"
          case "$u" in *@*) at=yes;; *) at=NO;; esac
          echo "Sender has @: $at · sender domain: ${u#*@} · password length: ${#p} (a Gmail App Password is 16) · recipient has @: $(case "$t" in *@*) echo yes;; *) echo NO;; esac)"

      - name: Send the designed email
        if: env.HAS_MAIL == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USER }}
          password: ${{ env.MAIL_PASS }}
          to: ${{ env.MAIL_DEST }}
          from: SahiCar weekly update <${{ env.MAIL_USER }}>
          subject: 'Test: SahiCar weekly update email'
          html_body: file://weekly-email.html
          body: 'Test of the SahiCar weekly update email: ${{ steps.issue.outputs.url }}'
